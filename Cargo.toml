[package]
name = "orbs-tee-nitro"
version = "0.1.0"
edition = "2021"
description = "ORBS TEE Framework SDK for AWS Nitro Enclaves"
rust-version = "1.83"

[dependencies]
# ORBS TEE Protocol
orbs-tee-protocol = "0.1.4"

# Async runtime - needed for async/await in Rust
tokio = { version = "1.35", features = ["full"] }

# AWS Nitro Enclaves SDK for attestation (Linux-only)
aws-nitro-enclaves-nsm-api = { version = "0.4", optional = true }

# Cryptography
secp256k1 = { version = "0.28", features = ["rand"] }  # ECDSA signing
sha2 = "0.10"                                          # SHA-256 hashing
rand = "0.8"                                           # Random number generation

# Serialization
serde = { version = "1.0", features = ["derive"] }     # Serialize/deserialize
serde_json = "1.0"                                     # JSON support
serde_bytes = "0.11"                                   # Efficient byte array handling

# vsocket support (Nitro-specific, Linux-only)
vsock = { version = "0.3", optional = true }           # vsocket communication

# Error handling
thiserror = "1.0"                                      # Better error types

# Async trait support
async-trait = "0.1"                                    # Allows async in traits

# Time
chrono = "0.4"                                         # Date/time handling

# Hex encoding
hex = "0.4"                                            # For hex encoding/decoding

# Base64 encoding
base64 = "0.21"                                        # For base64 encoding

# Additional dependencies
libc = "0.2"                                           # For closing file descriptors

[features]
default = ["nitro"]
nitro = ["aws-nitro-enclaves-nsm-api", "vsock"]  # Enable Nitro-specific features
