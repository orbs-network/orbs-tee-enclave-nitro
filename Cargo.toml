[package]
name = "orbs-tee-nitro"
version = "0.1.0"
edition = "2021"
description = "ORBS TEE Framework SDK for AWS Nitro Enclaves"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
aws-nitro-enclaves-nsm-api = "0.4"
secp256k1 = { version = "0.28", features = ["rand"] }
sha2 = "0.10"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
vsock = "0.3"
thiserror = "1.0"
async-trait = "0.1"
chrono = "0.4"
hex = "0.4"
libc = "0.2"

[dependencies.orbs-tee-protocol]
git = "https://github.com/orbs-network/orbs-tee-protocol"
path = "rust"
