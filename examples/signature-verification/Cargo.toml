[package]
name = "signature-verification"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"

[dependencies]
# Cryptography
secp256k1 = { version = "0.29", features = ["recovery"] }
sha2 = "0.10"
hex = "0.4"

# JSON handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Protocol (for response types)
orbs-tee-protocol = "0.1.4"
