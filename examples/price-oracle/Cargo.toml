[package]
name = "price-oracle-enclave"
version = "0.1.0"
edition = "2021"

[dependencies]
# ORBS TEE Nitro Framework
orbs-tee-nitro = { path = "../../" }  # Parent directory

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP client for fetching prices
reqwest = { version = "0.11", features = ["json"] }

# JSON handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
async-trait = "0.1"

# Time
chrono = "0.4"
