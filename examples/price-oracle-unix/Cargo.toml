[package]
name = "price-oracle-unix"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core enclave SDK (without nitro features for Unix socket)
orbs-tee-nitro = { path = "../../", default-features = false }
orbs-tee-protocol = "0.1.4"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP client for fetching prices
reqwest = { version = "0.11", features = ["json"] }

# JSON handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
async-trait = "0.1"
thiserror = "1.0"

# Time
chrono = "0.4"

# Crypto (for signing)
secp256k1 = { version = "0.29", features = ["rand"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
